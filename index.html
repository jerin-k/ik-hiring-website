<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IK Hiring Dashboard — InterviewKickstart</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app">
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <h1>Hiring Dashboard</h1>
        <p class="auth-subtitle">InterviewKickstart · Talent Acquisition</p>
        <div id="google-signin-btn"></div>
        <p class="auth-note">Sign in with your @interviewkickstart.com account</p>
      </div>
    </div>

    <div id="main-app" class="hidden">
      <div class="header">
        <div class="header-left">
          <h1>IK Hiring Dashboard</h1>
          <div class="meta" id="last-updated"></div>
        </div>
        <div class="header-right">
          <button class="refresh-btn" id="refreshBtn" title="Trigger Ashby data refresh">&#x21bb; Refresh</button>
          <span class="user-email" id="user-email"></span>
          <button id="signout-btn" class="btn-signout">Sign out</button>
        </div>
      </div>

      <div class="nav-strip" id="nav-strip"></div>

      <div class="container">
        <div id="page-content" class="page-content"></div>
      </div>
    </div>
  </div>

  <script src="/js/chart.umd.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
